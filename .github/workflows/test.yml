# Hoverleser: Test Workflow
# Runs the lookup and dictionary-build tests. They need no dependencies and no
# network: the dictionary excerpt they use is committed under tests/fixtures.

name: Test

"on":
  push:
    branches: [main]
    paths-ignore:
      - updates.json
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run tests
        run: node --test
