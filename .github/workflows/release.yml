# Hoverleser: GitHub Actions release workflow
#
# Trigger: pushes to main (ignoring updates.json, which the bot itself commits),
# plus manual runs from the Actions tab.
#
# A push does NOT automatically sign. The `version` job first checks whether the
# manifest version has already been released; if it has, the firefox and chrome
# jobs are skipped instead of failing. AMO refuses to sign a version it has
# already signed, so signing only happens on a push that bumps the version.
#
# Two INDEPENDENT jobs then run in parallel:
#   firefox – signs an unlisted XPI via AMO, publishes it to a GitHub Release,
#             and commits the updated updates.json so Firefox can auto-update.
#   chrome  – builds the Chromium zip and publishes it to the same Release.
#
# Each job uses its own browser-named source manifest (manifest.firefox.json /
# manifest.chrome.json) and stages it as the manifest.json that the packaged
# artifact requires. Neither job depends on the other: if one fails it does not
# block or cancel the other, and a failed job publishes nothing.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   AMO_API_KEY:    addons.mozilla.org/developers, API Keys  (format user:NNNN:NN)
#   AMO_API_SECRET: same page
#
# NOTE ON THE SIGNED FILENAME
#   `web-ext sign` does NOT support --filename; the artifact name is decided by
#   AMO and has varied between web-ext releases (hoverleser-1.1.0.xpi,
#   addon_hoverleser_app-1.1.0-an+fx.xpi, ...). This workflow therefore renames
#   whatever single .xpi lands in the artifacts dir to a deterministic
#   hoverleser-<version>-firefox.xpi and uploads that exact path.

name: Build & Release

"on":
  push:
    branches: [main]
    paths-ignore:
      - updates.json
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if this version already has a release (will fail at AMO if already signed)'
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION:  ${{ steps.read.outputs.VERSION }}
      TAG:      ${{ steps.read.outputs.TAG }}
      RELEASED: ${{ steps.read.outputs.RELEASED }}
      PROCEED:  ${{ steps.read.outputs.PROCEED }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read and validate version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE:    ${{ inputs.force }}
        run: |
          set -euo pipefail
          FF=$(node -p "require('./src/manifest.firefox.json').version")
          CR=$(node -p "require('./src/manifest.chrome.json').version")

          if [ "$FF" != "$CR" ]; then
            echo "::error title=Version mismatch::manifest.firefox.json is $FF but manifest.chrome.json is $CR. Keep them in sync."
            exit 1
          fi
          if ! echo "$FF" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error title=Bad version::'$FF' is not a valid Firefox add-on version string"
            exit 1
          fi

          TAG="v$FF"
          RELEASED=false
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASED=true
          fi

          PROCEED=true
          if [ "$RELEASED" = "true" ] && [ "${FORCE:-false}" != "true" ]; then
            PROCEED=false
            echo "::notice title=Skipping release::$TAG already exists. Bump \"version\" in both manifests to publish a new release."
          fi

          {
            echo "VERSION=$FF"
            echo "TAG=$TAG"
            echo "RELEASED=$RELEASED"
            echo "PROCEED=$PROCEED"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Version::$FF (tag $TAG, already released: $RELEASED, proceeding: $PROCEED)"

  firefox:
    needs: version
    if: needs.version.outputs.PROCEED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: |
          set -euxo pipefail
          npm install -g web-ext@8
          echo "node:    $(node --version)"
          echo "web-ext: $(web-ext --version)"

      - name: Preflight checks
        env:
          AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail

          # Secret presence (lengths only, never the values themselves)
          if [ -z "${AMO_API_KEY:-}" ]; then
            echo "::error title=Missing secret::AMO_API_KEY is empty or not set"; exit 1
          fi
          if [ -z "${AMO_API_SECRET:-}" ]; then
            echo "::error title=Missing secret::AMO_API_SECRET is empty or not set"; exit 1
          fi
          echo "AMO_API_KEY length:    ${#AMO_API_KEY}"
          echo "AMO_API_SECRET length: ${#AMO_API_SECRET}"
          case "$AMO_API_KEY" in
            user:*) echo "AMO_API_KEY format: ok (user:NNNN:NN)" ;;
            *) echo "::warning title=Suspicious key::AMO_API_KEY does not start with 'user:'; the key and secret may be swapped" ;;
          esac

          # Manifest sanity: unlisted signing requires an explicit add-on id.
          node -e "
            const m = require('./src/manifest.firefox.json');
            const g = m.browser_specific_settings?.gecko ?? {};
            if (!g.id) { console.log('::error title=Manifest::browser_specific_settings.gecko.id is required to sign an unlisted add-on'); process.exit(1); }
            console.log('gecko id:', g.id);
            console.log('manifest_version:', m.manifest_version);
            console.log('update_url:', g.update_url ?? '(none)');
          "

      - name: Lint extension
        working-directory: src
        run: |
          set -euo pipefail
          cp manifest.firefox.json manifest.json
          # Surfaces manifest/API errors here instead of as an opaque AMO
          # validation blob. --self-hosted matches the unlisted channel.
          web-ext lint \
            --source-dir . \
            --self-hosted \
            --warnings-as-errors=false \
            --ignore-files \
              "manifest.chrome.json" "manifest.firefox.json" \
              "node_modules/**" "dist/**" "scripts/**" "README.md" ".git/**"

      - name: Sign via AMO (unlisted)
        id: sign
        env:
          AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION:        ${{ needs.version.outputs.VERSION }}
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.xpi
          # web-ext / AMO require the packaged manifest to be named manifest.json
          cp manifest.firefox.json manifest.json

          set +e
          web-ext sign \
            --verbose \
            --no-input \
            --timeout 900000 \
            --source-dir . \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key    "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --ignore-files \
              "manifest.chrome.json" "manifest.firefox.json" \
              "node_modules/**" "dist/**" "scripts/**" "README.md" ".git/**" \
            2>&1 | tee ../web-ext-sign.log
          SIGN_RC=${PIPESTATUS[0]}
          set -e

          echo "--- src/dist after sign (rc=$SIGN_RC) ---"
          ls -la dist || true

          if [ "$SIGN_RC" -ne 0 ]; then
            echo "::error title=web-ext sign failed::exit code $SIGN_RC; log tail below, full log in the web-ext-sign-log artifact"
            tail -n 60 ../web-ext-sign.log || true
            exit "$SIGN_RC"
          fi

          # `web-ext sign` has no --filename option and AMO's naming has changed
          # across web-ext versions, so normalize to one predictable name.
          mapfile -t XPIS < <(find dist -maxdepth 1 -name '*.xpi' | sort)
          echo "xpi files found: ${#XPIS[@]}"
          if [ "${#XPIS[@]}" -gt 0 ]; then printf '  %s\n' "${XPIS[@]}"; fi

          if [ "${#XPIS[@]}" -eq 0 ]; then
            echo "::error title=No XPI produced::web-ext sign reported success but wrote no .xpi to src/dist. The version may have been signed on AMO while the download failed; check https://addons.mozilla.org/developers/addon/hoverleser/versions before re-running."
            exit 1
          fi
          if [ "${#XPIS[@]}" -gt 1 ]; then
            echo "::error title=Ambiguous XPI::more than one .xpi in src/dist; refusing to guess which to publish"
            exit 1
          fi

          TARGET="dist/hoverleser-${VERSION}-firefox.xpi"
          if [ "${XPIS[0]}" != "$TARGET" ]; then
            echo "renaming ${XPIS[0]} -> $TARGET"
            mv "${XPIS[0]}" "$TARGET"
          fi
          echo "XPI_PATH=src/$TARGET" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed::$TARGET ($(stat -c%s "$TARGET") bytes)"

      - name: Upload sign log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ext-sign-log
          path: |
            web-ext-sign.log
            src/dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Create GitHub Release and upload Firefox XPI
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.TAG }}
          name: Hoverleser ${{ needs.version.outputs.TAG }}
          body: |
            ## Hoverleser ${{ needs.version.outputs.TAG }}

            Hover over any German word to see its translation, gender, IPA pronunciation, and grammatical forms. Fully offline after one-time dictionary import. Supports Firefox and Chromium-based browsers.

            ### Firefox
            Download `hoverleser-*-firefox.xpi` and drag it onto any Firefox window.

            ### Chrome / Chromium
            Download `hoverleser-*-chrome.zip`, unzip to a permanent folder, then load via `chrome://extensions` > Developer mode > Load unpacked.

            ### Dictionary
            Open the extension settings and click **Download & Import** to fetch the pre-built dictionary (~20 MB) directly from GitHub Releases. Alternatively, drag a `de-latest.jsonl.gz` file onto the import area.
          files: ${{ steps.sign.outputs.XPI_PATH }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Update updates.json with signed XPI hash
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
          REPO:    ${{ github.repository }}
          XPI:     ${{ steps.sign.outputs.XPI_PATH }}
        run: |
          set -euo pipefail
          HASH=$(sha256sum "$XPI" | awk '{print $1}')
          BASENAME=$(basename "$XPI")
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/${BASENAME}"
          export HASH URL
          python3 - <<'PYEOF'
          import json, os
          version  = os.environ['VERSION']
          addon_id = 'addon@hoverleser.app'
          with open('updates.json', 'r') as f:
              doc = json.load(f)
          entries = doc['addons'][addon_id]['updates']
          entries = [e for e in entries if e.get('version') != version]
          entries.append({
              'version':     version,
              'update_link': os.environ['URL'],
              'update_hash': 'sha256:' + os.environ['HASH'],
          })
          doc['addons'][addon_id]['updates'] = entries
          with open('updates.json', 'w') as f:
              json.dump(doc, f, indent=2)
              f.write('\n')
          print(f"[updates.json] v{version}  sha256:{os.environ['HASH']}")
          PYEOF

      - name: Commit and push updates.json
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: update updates.json for v${{ needs.version.outputs.VERSION }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  chrome:
    needs: version
    if: needs.version.outputs.PROCEED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Chrome zip
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
        working-directory: src
        run: |
          set -euxo pipefail
          mkdir -p dist/.chrome-stage/icons dist/.chrome-stage/lib
          cp manifest.chrome.json dist/.chrome-stage/manifest.json
          cp background.js content.js popup.html popup.js dist/.chrome-stage/
          cp icons/icon16.png icons/icon32.png icons/icon48.png \
             icons/icon96.png icons/icon128.png dist/.chrome-stage/icons/
          cp lib/browser-polyfill.min.js dist/.chrome-stage/lib/
          cd dist/.chrome-stage
          zip -r "../hoverleser-${VERSION}-chrome.zip" .
          cd ../..
          rm -rf dist/.chrome-stage
          ls -la dist

      - name: Upload Chrome zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.TAG }}
          files: src/dist/hoverleser-${{ needs.version.outputs.VERSION }}-chrome.zip
          fail_on_unmatched_files: true
