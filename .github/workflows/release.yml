# Hoverleser: build, sign and publish the browser builds.
#
# Repository secrets (Settings -> Secrets -> Actions):
#   AMO_API_KEY     addons.mozilla.org/developers, API Keys  (user:NNNN:NN)
#   AMO_API_SECRET  same page
#
# AMO signs a given version once. If it holds a version for manual review,
# re-running this workflow collects the signed file; bumping the version
# instead strands the one already uploaded.

name: Build & Release

"on":
  push:
    branches: [main]
    paths-ignore:
      - updates.json
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if this version already has a GitHub Release'
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      VERSION:  ${{ steps.read.outputs.VERSION }}
      TAG:      ${{ steps.read.outputs.TAG }}
      RELEASED: ${{ steps.read.outputs.RELEASED }}
      PROCEED:  ${{ steps.read.outputs.PROCEED }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read and validate version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE:    ${{ inputs.force }}
        run: |
          set -euo pipefail
          FF=$(node -p "require('./src/manifest.firefox.json').version")
          CR=$(node -p "require('./src/manifest.chrome.json').version")

          if [ "$FF" != "$CR" ]; then
            echo "::error title=Version mismatch::manifest.firefox.json is $FF but manifest.chrome.json is $CR. Keep them in sync."
            exit 1
          fi
          if ! echo "$FF" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error title=Bad version::'$FF' is not a valid Firefox add-on version string"
            exit 1
          fi

          TAG="v$FF"
          # Keyed on the XPI asset, not the tag: the chrome job may have
          # created the release already.
          RELEASED=false
          if gh release view "$TAG" --repo "${{ github.repository }}" \
               --json assets -q '.assets[].name' 2>/dev/null \
               | grep -qx "hoverleser-${FF}-firefox.xpi"; then
            RELEASED=true
          fi

          PROCEED=true
          if [ "$RELEASED" = "true" ] && [ "${FORCE:-false}" != "true" ]; then
            PROCEED=false
            echo "::notice title=Skipping release::$TAG already has hoverleser-${FF}-firefox.xpi attached. Bump \"version\" in both manifests to publish a new release."
          fi

          {
            echo "VERSION=$FF"
            echo "TAG=$TAG"
            echo "RELEASED=$RELEASED"
            echo "PROCEED=$PROCEED"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Version::$FF (tag $TAG, already released: $RELEASED, proceeding: $PROCEED)"

  firefox:
    needs: version
    if: needs.version.outputs.PROCEED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install web-ext
        run: |
          set -euxo pipefail
          npm install -g web-ext@8
          echo "node:    $(node --version)"
          echo "web-ext: $(web-ext --version)"

      - name: Preflight checks
        env:
          AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${AMO_API_KEY:-}" ]; then
            echo "::error title=Missing secret::AMO_API_KEY is empty or not set"; exit 1
          fi
          if [ -z "${AMO_API_SECRET:-}" ]; then
            echo "::error title=Missing secret::AMO_API_SECRET is empty or not set"; exit 1
          fi
          case "$AMO_API_KEY" in
            user:*) echo "AMO_API_KEY format: ok (user:NNNN:NN)" ;;
            *) echo "::warning title=Suspicious key::AMO_API_KEY does not start with 'user:'; the key and secret may be swapped" ;;
          esac

          # Unlisted signing requires an explicit add-on id.
          node -e "
            const m = require('./src/manifest.firefox.json');
            const g = m.browser_specific_settings?.gecko ?? {};
            if (!g.id) { console.log('::error title=Manifest::browser_specific_settings.gecko.id is required to sign an unlisted add-on'); process.exit(1); }
            console.log('gecko id:', g.id);
            console.log('manifest_version:', m.manifest_version);
            console.log('update_url:', g.update_url ?? '(none)');
          "

      - name: Lint extension
        working-directory: src
        run: |
          set -euo pipefail
          cp manifest.firefox.json manifest.json
          web-ext lint \
            --source-dir . \
            --self-hosted \
            --warnings-as-errors=false \
            --ignore-files \
              "manifest.chrome.json" "manifest.firefox.json" \
              "node_modules/**" "dist/**" "scripts/**" "README.md" ".git/**"

      # A version that already exists cannot be re-signed, only downloaded.
      - name: Check AMO for this version
        id: lookup
        env:
          AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION:        ${{ needs.version.outputs.VERSION }}
        run: |
          # GitHub runs run: blocks with `bash -e`, so a non-zero exit must be
          # caught with `|| RC=$?` or the step dies before the case below.
          set -uo pipefail
          mkdir -p src/dist
          RC=0
          node scripts/amo-fetch-signed.mjs --version "$VERSION" --out src/dist || RC=$?
          case "$RC" in
            0)  STATE=ready ;;
            10) STATE=pending ;;
            20) STATE=absent ;;
            *)  echo "::error title=AMO lookup failed::exit code $RC"; exit "$RC" ;;
          esac
          echo "STATE=$STATE" >> "$GITHUB_OUTPUT"
          echo "::notice title=AMO state::$STATE"

      - name: Sign via AMO (unlisted)
        id: sign
        if: steps.lookup.outputs.STATE == 'absent'
        env:
          # web-ext reads these itself, keeping credentials out of argv.
          WEB_EXT_API_KEY:    ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          # used by the amo-fetch-signed.mjs fallback below
          AMO_API_KEY:        ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET:     ${{ secrets.AMO_API_SECRET }}
          VERSION:            ${{ needs.version.outputs.VERSION }}
        working-directory: src
        run: |
          set -uo pipefail
          rm -f dist/*.xpi
          # web-ext / AMO require the packaged manifest to be named manifest.json
          cp manifest.firefox.json manifest.json

          # --approval-timeout is the signing wait: past ~6 min the version is
          # in a human review queue, which no amount of waiting will clear.
          SIGN_RC=0
          { web-ext sign \
            --verbose \
            --no-input \
            --timeout 300000 \
            --approval-timeout 360000 \
            --source-dir . \
            --artifacts-dir dist \
            --channel unlisted \
            --ignore-files \
              "manifest.chrome.json" "manifest.firefox.json" \
              "node_modules/**" "dist/**" "scripts/**" "README.md" ".git/**" \
            2>&1 | tee ../web-ext-sign.log; } || SIGN_RC=${PIPESTATUS[0]}

          echo "--- src/dist after sign (rc=$SIGN_RC) ---"
          ls -la dist || true

          if [ "$SIGN_RC" -ne 0 ]; then
            # Held for review, or a real failure?
            cd ..
            LOOKUP_RC=0
            node scripts/amo-fetch-signed.mjs --version "$VERSION" --out src/dist || LOOKUP_RC=$?
            if [ "$LOOKUP_RC" -eq 10 ]; then
              echo "STATE=pending" >> "$GITHUB_OUTPUT"
              echo "::warning title=Awaiting AMO review::The upload succeeded but AMO has not signed v$VERSION yet, so nothing was published. Re-run this workflow once AMO approves it. Do NOT bump the version and do NOT re-sign: the version already exists on AMO."
              exit 0
            fi
            if [ "$LOOKUP_RC" -eq 0 ]; then
              echo "STATE=ready" >> "$GITHUB_OUTPUT"
              echo "::notice title=Recovered::sign timed out but the signed XPI was downloadable"
              exit 0
            fi
            echo "::error title=web-ext sign failed::exit code $SIGN_RC; log tail below, full log in the web-ext-sign-log artifact"
            tail -n 60 web-ext-sign.log || true
            exit "$SIGN_RC"
          fi

          mapfile -t XPIS < <(find dist -maxdepth 1 -name '*.xpi' | sort)
          echo "xpi files found: ${#XPIS[@]}"
          if [ "${#XPIS[@]}" -gt 0 ]; then printf '  %s\n' "${XPIS[@]}"; fi

          if [ "${#XPIS[@]}" -eq 0 ]; then
            echo "::error title=No XPI produced::web-ext sign reported success but wrote no .xpi to src/dist"
            exit 1
          fi
          if [ "${#XPIS[@]}" -gt 1 ]; then
            echo "::error title=Ambiguous XPI::more than one .xpi in src/dist; refusing to guess which to publish"
            exit 1
          fi

          TARGET="dist/hoverleser-${VERSION}-firefox.xpi"
          if [ "${XPIS[0]}" != "$TARGET" ]; then
            echo "renaming ${XPIS[0]} -> $TARGET"
            mv "${XPIS[0]}" "$TARGET"
          fi
          echo "STATE=ready" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed::$TARGET ($(stat -c%s "$TARGET") bytes)"

      - name: Resolve publish state
        id: state
        env:
          RAW_STATE: ${{ steps.sign.outputs.STATE || steps.lookup.outputs.STATE }}
          VERSION:   ${{ needs.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          STATE="$RAW_STATE"
          echo "STATE=$STATE" >> "$GITHUB_OUTPUT"
          {
            echo "### Firefox v$VERSION"
            case "$STATE" in
              ready)   echo "Signed XPI in hand; publishing the release." ;;
              pending) echo "Uploaded to AMO but **awaiting review**. Nothing published. Re-run this workflow later; do not bump the version." ;;
              *)       echo "Unexpected state: \`$STATE\`" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Redact sign log
        if: always()
        run: |
          # web-ext does not log credentials today; this keeps that true after upgrades.
          [ -f web-ext-sign.log ] && \
            sed -i -E 's/(JWT|Bearer|api.?key|api.?secret)[=: ]+[A-Za-z0-9._:-]+/\1 [redacted]/gI' web-ext-sign.log
          exit 0

      - name: Upload sign log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-ext-sign-log
          path: |
            web-ext-sign.log
            src/dist/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release and upload Firefox XPI
        if: steps.state.outputs.STATE == 'ready'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.TAG }}
          name: Hoverleser ${{ needs.version.outputs.TAG }}
          body: |
            ## Hoverleser ${{ needs.version.outputs.TAG }}

            Hover over any German word to see its translation, gender, IPA pronunciation, and grammatical forms. Fully offline after one-time dictionary import. Supports Firefox and Chromium-based browsers.

            ### Firefox
            Download `hoverleser-*-firefox.xpi` and drag it onto any Firefox window.

            ### Chrome / Chromium
            Download `hoverleser-*-chrome.zip`, unzip to a permanent folder, then load via `chrome://extensions` > Developer mode > Load unpacked.

            ### Dictionary
            Open the extension settings and click **Download & Import** to fetch the pre-built dictionary (~20 MB) directly from GitHub Releases. Alternatively, drag a `de-latest.jsonl.gz` file onto the import area.
          files: src/dist/hoverleser-${{ needs.version.outputs.VERSION }}-firefox.xpi
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Update updates.json with signed XPI hash
        if: steps.state.outputs.STATE == 'ready'
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
          REPO:    ${{ github.repository }}
        run: |
          set -euo pipefail
          XPI="src/dist/hoverleser-${VERSION}-firefox.xpi"
          HASH=$(sha256sum "$XPI" | awk '{print $1}')
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/$(basename "$XPI")"
          export HASH URL
          python3 - <<'PYEOF'
          import json, os
          version  = os.environ['VERSION']
          addon_id = 'addon@hoverleser.app'
          with open('updates.json', 'r') as f:
              doc = json.load(f)
          entries = doc['addons'][addon_id]['updates']
          entries = [e for e in entries if e.get('version') != version]
          entries.append({
              'version':     version,
              'update_link': os.environ['URL'],
              'update_hash': 'sha256:' + os.environ['HASH'],
          })
          doc['addons'][addon_id]['updates'] = entries
          with open('updates.json', 'w') as f:
              json.dump(doc, f, indent=2)
              f.write('\n')
          print(f"[updates.json] v{version}  sha256:{os.environ['HASH']}")
          PYEOF

      - name: Commit and push updates.json
        if: steps.state.outputs.STATE == 'ready'
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore: update updates.json for v${VERSION} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  chrome:
    needs: version
    if: needs.version.outputs.PROCEED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Chrome zip
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
        working-directory: src
        run: |
          set -euxo pipefail
          mkdir -p dist/.chrome-stage/icons dist/.chrome-stage/lib
          cp manifest.chrome.json dist/.chrome-stage/manifest.json
          cp background.js content.js popup.html popup.js dist/.chrome-stage/
          cp icons/icon16.png icons/icon32.png icons/icon48.png \
             icons/icon96.png icons/icon128.png dist/.chrome-stage/icons/
          cp lib/browser-polyfill.min.js dist/.chrome-stage/lib/
          cd dist/.chrome-stage
          zip -r "../hoverleser-${VERSION}-chrome.zip" .
          cd ../..
          rm -rf dist/.chrome-stage
          ls -la dist

      - name: Upload Chrome zip to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.TAG }}
          files: src/dist/hoverleser-${{ needs.version.outputs.VERSION }}-chrome.zip
          fail_on_unmatched_files: true
