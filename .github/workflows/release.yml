# Hoverleser: GitHub Actions release workflow
# Triggers on every push to main.
# Produces a signed XPI via AMO (unlisted) and publishes it as a GitHub Release.
#
# Required repository secrets (Settings → Secrets → Actions):
#   AMO_API_KEY:     addons.mozilla.org/developers, API Keys
#   AMO_API_SECRET: same page

name: Build & Release

"on":
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Sign via AMO
        id: sign
        continue-on-error: true
        env:
          AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        working-directory: src
        run: bash package.sh sign

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Hoverleser ${{ steps.version.outputs.TAG }}
          body: |
            ## Hoverleser ${{ steps.version.outputs.TAG }}

            Hover over any German word to see its translation, gender, IPA pronunciation and grammatical forms. Fully offline after one-time dictionary import. Supports Firefox and Chromium-based browsers.

            ### Firefox
            Download `hoverleser-*-firefox.xpi` and drag it onto any Firefox window.

            ### Chrome / Chromium
            Download `hoverleser-*-chrome.zip`, unzip to a permanent folder, then load via `chrome://extensions` > Developer mode > Load unpacked.

            ### Dictionary
            Download `de-v*.jsonl.gz`, open the extension settings, drag the file onto the import area and wait for the green dot.
          files: src/dist/hoverleser-*-firefox.xpi
          draft: false
          prerelease: false
          make_latest: true

  release-chrome:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build Chrome zip
        working-directory: src
        run: bash package.sh chrome

      - name: Upload Chrome zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: src/dist/hoverleser-*-chrome.zip
          fail_on_unmatched_files: true
