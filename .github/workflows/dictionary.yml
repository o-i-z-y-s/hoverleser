# Hoverleser: Dictionary Build Workflow
# Triggered manually only. Run this when you want to produce and publish
# a new pre-built dictionary release (e.g. after a kaikki.org data refresh
# or a build-dict.js logic change).

name: Build Dictionary

"on":
  workflow_dispatch:

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build dictionary from en.wiktionary (English glosses)
        working-directory: src
        run: |
          mkdir -p dist
          node scripts/build-dict.js \
            --code de \
            --out  dist/de-en.jsonl
          echo "en.wiktionary entries: $(wc -l < dist/de-en.jsonl)"

      - name: Compress dictionary
        id: compress
        working-directory: src
        run: |
          DICT_DATE=$(date +%Y-%m)
          VFILE="dist/de-${DICT_DATE}.jsonl"
          cp dist/de-en.jsonl "$VFILE"
          gzip -k "$VFILE"
          cp "${VFILE}.gz" dist/de-latest.jsonl.gz
          echo "DICT_DATE=${DICT_DATE}" >> $GITHUB_OUTPUT
          ls -lh dist/de-*.jsonl dist/de-*.jsonl.gz

      - name: Upload versioned dictionary to dated release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: dict-${{ steps.compress.outputs.DICT_DATE }}
          name: "Dictionary ${{ steps.compress.outputs.DICT_DATE }}"
          body: "Pre-built German dictionary from en.wiktionary (${{ steps.compress.outputs.DICT_DATE }})."
          files: |
            src/dist/de-${{ steps.compress.outputs.DICT_DATE }}.jsonl.gz
          fail_on_unmatched_files: true
          make_latest: false

      - name: Force-update dict-latest tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dict-latest
          git push origin refs/tags/dict-latest --force

      - name: Upload de-latest.jsonl.gz to dict-latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: dict-latest
          name: "Dictionary (latest)"
          body: "Pre-built German dictionary from en.wiktionary. Fetch via the extension's Download & Import button."
          files: |
            src/dist/de-latest.jsonl.gz
          fail_on_unmatched_files: true
          make_latest: false
